<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Data - Dashboard Hybride & Multimédia</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loader">Chargement...</div>

    <div id="sidebar">
        <h1>🚄 SNCF Analytics</h1>

        <div class="mode-container">
            <span class="mode-label">Source des données :</span>
            <button id="modeBtn" class="switch-btn btn-json" onclick="toggleMode()">
                📂 Fichier JSON
            </button>
        </div>

        <input type="text" id="search" class="search-box" placeholder="Rechercher une gare..."
            onkeyup="filterStations()">

        <div id="global-stats">
            <h3>Vue d'ensemble</h3>
            <div class="card">
                <div class="stat-big" id="total-stations">0</div>
                <div class="stat-desc">Gares référencées</div>
            </div>
            <h3>Répartition par Région</h3>
            <div class="chart-wrapper"><canvas id="regionChart"></canvas></div>
            <h3>Top 5 Trafic (2023)</h3>
            <ul class="top-list" id="top-stations-list"></ul>
        </div>

        <div id="details-panel">
            <span class="close-btn" onclick="closeDetails()">x</span>
            <h2 id="st-name">Nom</h2>
            <p id="st-geo" style="color:#666; font-size:0.9rem; margin-bottom: 10px;"></p>

            <div class="station-photo-containere">
                <span class="photo-placeholder" id="photo-placeholder">Recherche photo...</span>
                <img id="st-photo" src="" alt="Photo de la gare">
            </div>

            <h3>Évolution Fréquentation</h3>
            <div class="chart-wrapper"><canvas id="evolutionChart"></canvas></div>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
